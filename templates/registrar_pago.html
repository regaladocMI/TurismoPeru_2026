<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Registrar Pago</h2>
        <form action="/guardar-pago" method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Reserva</label>
                <select name="id_reserva" class="form-select" required>
                    <option value="">Seleccione una reserva pendiente</option>
                    {% for r in reservas %}
                    <option value="{{r.id_reserva}}">{{r.codigo_reserva}} — Saldo: S/ {{r.saldo_pendiente}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Medio de pago</label>
                <select name="id_medio_pago" class="form-select" required>
                    <option value="">Seleccione un medio de pago</option>
                    {% for m in medios_pago %}
                    <option value="{{m.id_medio_pago}}">{{m.nombre}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Monto (S/)</label>
                <input type="number" step="0.01" min="0.01" name="monto" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Número de operación</label>
                <input type="text" name="numero_operacion" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label">Comprobante</label>
                <input type="text" name="comprobante" class="form-control">
            </div>
            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-success px-5">Registrar Pago</button>
                <a href="/" class="btn btn-secondary px-5">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
