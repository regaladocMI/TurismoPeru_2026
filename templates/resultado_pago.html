<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        {% if resultado %}
        <div class="alert alert-success">
            <h4 class="alert-heading">¡Pago registrado!</h4>
            <p>Saldo pendiente actualizado: <strong>S/ {{resultado.saldo_pendiente}}</strong></p>
            <p class="mb-0">{{resultado.mensaje}}</p>
        </div>
        {% else %}
        <div class="alert alert-danger">
            <h4 class="alert-heading">No se pudo registrar el pago</h4>
            <p class="mb-0">Verifica los datos ingresados e intenta nuevamente.</p>
        </div>
        {% endif %}
        <a href="/nuevo-pago" class="btn btn-primary">Registrar otro pago</a>
        <a href="/" class="btn btn-secondary">Volver al inicio</a>
    </div>
</body>
</html>
