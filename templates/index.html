<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Turismo Perú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">
            Sistema Turismo Perú
        </h2>
        <h3 class="text-rigth mb-4">
            Lista de Personas
        </h3>
        <div class="mb-3">
            <a href="/nuevo" class="btn btn-success">
                Registrar Persona
            </a>
        </div>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tipo Persona</th>
                    <th>Nombres</th>
                    <th>APaterno</th>
                    <th>AMaterno</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for persona in personas %}
                <tr>
                    <td>{{persona.id_persona}}</td>
                    <td>{{persona.tipo_persona}}</td>
                    <td>{{persona.nombres}}</td>
                    <td>{{persona.apaterno}}</td>
                    <td>{{persona.amaterno}}</td>
                    <td>{{persona.estado}}</td>
                    <td>
                        <a href="/editar/{{persona.id}}" class="btn btn-warning btn-sm">
                            Editar
                        </a>
                        <a href="/eliminar/{{persona.id}}" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar persona?')">
                            Eliminar
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
