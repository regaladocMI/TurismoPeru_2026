<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 mb-5">
        <h2 class="text-center mb-4">Registrar Nueva Reserva</h2>
        <form action="/guardar-reserva" method="post" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <select name="id_cliente" class="form-select" required>
                    <option value="">Seleccione un cliente</option>
                    {% for c in clientes %}
                    <option value="{{c.id_persona}}">{{c.nombres}} {{c.apaterno}} {{c.amaterno}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Paquete Turístico</label>
                <select name="id_paquete" class="form-select" required>
                    <option value="">Seleccione un paquete</option>
                    {% for p in paquetes %}
                    <option value="{{p.id_paquete}}">{{p.nombre}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Empleado a cargo</label>
                <select name="id_empleado" class="form-select" required>
                    <option value="">Seleccione un empleado</option>
                    {% for e in empleados %}
                    <option value="{{e.id_persona}}">{{e.nombres}} {{e.apaterno}} {{e.amaterno}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Alojamiento</label>
                <select name="id_alojamiento" class="form-select" required>
                    <option value="">Seleccione un alojamiento</option>
                    {% for a in alojamientos %}
                    <option value="{{a.id_alojamiento}}">{{a.nombre}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Habitación</label>
                <select name="id_habitacion" class="form-select" required>
                    <option value="">Seleccione una habitación</option>
                    {% for h in habitaciones %}
                    <option value="{{h.id_habitacion}}">Hab. {{h.id_habitacion}} — S/ {{h.precio_noche}} / noche</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Número de personas</label>
                <input type="number" name="numero_personas" class="form-control" min="1" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha de inicio</label>
                <input type="date" name="fecha_inicio" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha de fin</label>
                <input type="date" name="fecha_fin" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Precio total (S/)</label>
                <input type="number" step="0.01" min="0" name="precio_total" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Adelanto (S/)</label>
                <input type="number" step="0.01" min="0" name="adelanto" class="form-control" value="0">
            </div>
            <div class="col-12">
                <label class="form-label">Observaciones</label>
                <textarea name="observaciones" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-success px-5">Registrar Reserva</button>
                <a href="/" class="btn btn-secondary px-5">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
